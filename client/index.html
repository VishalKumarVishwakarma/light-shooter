<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8P Light Shooter — Realtime Arena</title>
  <meta name="description" content="8P Light Shooter — a fast, free, browser-based 2-8 player top-down arena shooter. Create a lobby, share the code, last squad standing wins." />
  <meta property="og:title" content="8P Light Shooter — Realtime Arena" />
  <meta property="og:description" content="Free 2-8 player browser arena shooter. No install — create a lobby and fight." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b0e14" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e14'/%3E%3Ccircle cx='32' cy='34' r='16' fill='%2322d3ee'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%23083344'/%3E%3Crect x='44' y='30' width='16' height='7' rx='2' fill='%2394a3b8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: radial-gradient(1200px 800px at 50% -10%, #16213a 0%, #0b0e14 55%, #06080d 100%);
      color: #e2e8f0;
      font-family: 'Rajdhani', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 0 6px; user-select: none;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, #22d3ee, #2563eb);
      display: grid; place-items: center;
      font-family: 'Anton', sans-serif; font-size: 15px; color: #04121a;
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.55);
    }
    header h1 {
      font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 3px;
      margin: 0; color: #fff; font-weight: 400;
    }
    header h1 span { color: #22d3ee; }
    .live {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; letter-spacing: 2px; color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4); border-radius: 999px;
      padding: 3px 12px; margin-left: 8px;
    }
    .live i {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    #frame {
      margin-top: 10px; padding: 10px; border-radius: 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(34, 211, 238, 0.25);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 45px rgba(34, 211, 238, 0.12), 0 25px 60px rgba(0,0,0,0.5);
      animation: rise 0.5s ease-out, framepulse 4s ease-in-out 0.6s infinite;
    }
    @keyframes framepulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 45px rgba(34, 211, 238, 0.12), 0 25px 60px rgba(0,0,0,0.5); }
      50% { box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 70px rgba(34, 211, 238, 0.22), 0 25px 60px rgba(0,0,0,0.5); }
    }
    @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
    #game canvas {
      display: block; border-radius: 10px; cursor: crosshair;
      margin: 0 auto;
    }
    #hud {
      margin-top: 10px; font-size: 14px; letter-spacing: 1.5px; color: #94a3b8;
      display: flex; gap: 18px; user-select: none;
    }
    #hud b { color: #e2e8f0; }
    #hud .k {
      border: 1px solid #334155; border-bottom-width: 2px; border-radius: 5px;
      padding: 0 7px; margin-right: 4px; color: #fff; background: #1e293b;
      font-family: 'Share Tech Mono', monospace; font-size: 11px;
    }
    footer { margin: 14px 0 26px; font-size: 12px; letter-spacing: 2px; color: #475569; }
  </style>
</head>
<body>
  <header>
    <div class="logo">8P</div>
    <h1>LIGHT <span>SHOOTER</span></h1>
    <div class="live"><i></i>REALTIME</div>
  </header>
  <div id="frame"><div id="game"></div></div>
  <div id="hud">
    <span><span class="k">W A S D</span><span class="k">←↑↓→</span> <b>move</b></span>
    <span><b>mouse</b> aim</span>
    <span><b>click</b> shoot</span>
  </div>
  <footer>2–8 PLAYERS · AUTHORITATIVE SERVER · LIGHTWEIGHT WEB BUILD</footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
